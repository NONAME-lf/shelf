appId: dev.shelf.desktop
productName: Shelf
copyright: Copyright © 2026 Artemii Mekshakov
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**
  - package.json
npmRebuild: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target: AppImage
